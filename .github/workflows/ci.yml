name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push should not keep burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: SEO sitemap diff (legacy URLs preserved)
        run: npm run seo:diff

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Without this a hung browser install ran to the 6h job ceiling. Eight
    # consecutive runs were cancelled that way, so the a11y gate never once
    # executed and accessibility regressions shipped to main unnoticed.
    timeout-minutes: 20
    env:
      BASE_URL: http://localhost:3000
      # The booking picker a11y test skips itself unless the flag is set, so
      # without this the new booking surface is never scanned in CI.
      NEXT_PUBLIC_BOOKING_FLAG: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--with-deps` shells out to apt-get, which is what hung. The
      # ubuntu-latest image already carries chromium's shared libraries.
      - name: Install Playwright chromium
        run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
